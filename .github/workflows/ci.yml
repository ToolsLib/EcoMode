name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build and run application regression checks
        run: |
          dotnet build EcoMode.slnx --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Solution build failed.' }
          dotnet format whitespace EcoMode.slnx --no-restore --verify-no-changes
          if ($LASTEXITCODE -ne 0) { throw 'Code formatting check failed.' }
          dotnet run --project tests/EcoMode.RegressionTests/EcoMode.RegressionTests.csproj --configuration Release --no-build -- --skip-power-read
          if ($LASTEXITCODE -ne 0) { throw 'Application regression checks failed.' }
      - name: Check release scripts and installer recovery policy
        run: ./tests/ReleaseScripts.Tests.ps1
      - name: Verify translations in a standalone executable
        run: |
          dotnet publish tests/EcoMode.RegressionTests/EcoMode.RegressionTests.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/localization-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Standalone localization build failed.' }
          & ./artifacts/localization-smoke/EcoMode.RegressionTests.exe --localization-smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Standalone localization checks failed.' }
